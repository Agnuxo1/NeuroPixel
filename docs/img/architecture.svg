<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f141c"/><stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="400" rx="18" fill="url(#bg)"/>

  <!-- entrada -->
  <text x="40" y="52" fill="#8b95a5" font-size="13" font-weight="600" letter-spacing="1">INPUT</text>
  <rect x="40" y="70" width="170" height="36" rx="8" fill="#1d2430" stroke="#2c3544"/>
  <text x="56" y="93" fill="#e6ebf2" font-size="14">AGENT = girl</text>
  <rect x="40" y="114" width="170" height="36" rx="8" fill="#1d2430" stroke="#2c3544"/>
  <text x="56" y="137" fill="#e6ebf2" font-size="14">ACTION = chases</text>
  <rect x="40" y="158" width="170" height="36" rx="8" fill="#1d2430" stroke="#2c3544"/>
  <text x="56" y="181" fill="#e6ebf2" font-size="14">camera pixels (opt.)</text>
  <rect x="40" y="214" width="170" height="36" rx="8" fill="#2b2410" stroke="#6b5a1c"/>
  <text x="56" y="237" fill="#ffd65a" font-size="14" font-weight="600">Question: AGENT?</text>

  <!-- diccionario de entrada -->
  <path d="M215 160 H265" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <rect x="270" y="110" width="150" height="100" rx="12" fill="#172338" stroke="#2a78d6"/>
  <text x="345" y="140" fill="#9cc3f5" font-size="13" font-weight="700" text-anchor="middle">DICTIONARY</text>
  <text x="345" y="162" fill="#d4e3f7" font-size="12.5" text-anchor="middle">word → colour</text>
  <text x="345" y="180" fill="#d4e3f7" font-size="12.5" text-anchor="middle">(16 learned channels)</text>
  <g transform="translate(300,188)">
    <rect width="14" height="12" rx="3" fill="#3f86e0"/><rect x="18" width="14" height="12" rx="3" fill="#e0823f"/>
    <rect x="36" width="14" height="12" rx="3" fill="#3fbf6a"/><rect x="54" width="14" height="12" rx="3" fill="#b9b9c2"/>
    <rect x="72" width="14" height="12" rx="3" fill="#8a5cd6"/>
  </g>

  <!-- lienzo -->
  <path d="M425 160 H470" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="52" fill="#8b95a5" font-size="13" font-weight="600" letter-spacing="1" text-anchor="middle">CANVAS (THE BRAIN)</text>
  <g transform="translate(478,70)" filter="url(#glow)">
    <g fill="#1b2230">
      <rect x="0" y="0" width="18" height="18" rx="4"/><rect x="22" y="0" width="18" height="18" rx="4"/><rect x="44" y="0" width="18" height="18" rx="4"/><rect x="66" y="0" width="18" height="18" rx="4"/><rect x="88" y="0" width="18" height="18" rx="4"/><rect x="110" y="0" width="18" height="18" rx="4"/><rect x="132" y="0" width="18" height="18" rx="4"/><rect x="154" y="0" width="18" height="18" rx="4"/>
    </g>
    <rect x="0" y="22" width="18" height="18" rx="4" fill="#1b2230"/><rect x="22" y="22" width="18" height="18" rx="4" fill="#b9b9c2"/><rect x="44" y="22" width="18" height="18" rx="4" fill="#3f86e0"/><rect x="66" y="22" width="18" height="18" rx="4" fill="#24406a"/><rect x="88" y="22" width="18" height="18" rx="4" fill="#1b2230"/><rect x="110" y="22" width="18" height="18" rx="4" fill="#1b2230"/><rect x="132" y="22" width="18" height="18" rx="4" fill="#1b2230"/><rect x="154" y="22" width="18" height="18" rx="4" fill="#1b2230"/>
    <rect x="0" y="44" width="18" height="18" rx="4" fill="#1b2230"/><rect x="22" y="44" width="18" height="18" rx="4" fill="#24406a"/><rect x="44" y="44" width="18" height="18" rx="4" fill="#2c4f80"/><rect x="66" y="44" width="18" height="18" rx="4" fill="#24406a"/><rect x="88" y="44" width="18" height="18" rx="4" fill="#b9b9c2"/><rect x="110" y="44" width="18" height="18" rx="4" fill="#e0823f"/><rect x="132" y="44" width="18" height="18" rx="4" fill="#5a3a22"/><rect x="154" y="44" width="18" height="18" rx="4" fill="#1b2230"/>
    <rect x="0" y="66" width="18" height="18" rx="4" fill="#1b2230"/><rect x="22" y="66" width="18" height="18" rx="4" fill="#1e3050"/><rect x="44" y="66" width="18" height="18" rx="4" fill="#2c4f80"/><rect x="66" y="66" width="18" height="18" rx="4" fill="#2a3f60"/><rect x="88" y="66" width="18" height="18" rx="4" fill="#3a3040"/><rect x="110" y="66" width="18" height="18" rx="4" fill="#5a3a22"/><rect x="132" y="66" width="18" height="18" rx="4" fill="#3a2a1c"/><rect x="154" y="66" width="18" height="18" rx="4" fill="#1b2230"/>
    <rect x="0" y="88" width="18" height="18" rx="4" fill="#1b2230"/><rect x="22" y="88" width="18" height="18" rx="4" fill="#1b2230"/><rect x="44" y="88" width="18" height="18" rx="4" fill="#2c4f80"/><rect x="66" y="88" width="18" height="18" rx="4" fill="#3f86e0"/><rect x="88" y="88" width="18" height="18" rx="4" fill="#2c4f80"/><rect x="110" y="88" width="18" height="18" rx="4" fill="#2a3f60"/><rect x="132" y="88" width="18" height="18" rx="4" fill="#24406a"/><rect x="154" y="88" width="18" height="18" rx="4" fill="#1b2230"/>
    <rect x="0" y="110" width="18" height="18" rx="4" fill="#1b2230"/><rect x="22" y="110" width="18" height="18" rx="4" fill="#1b2230"/><rect x="44" y="110" width="18" height="18" rx="4" fill="#24406a"/><rect x="66" y="110" width="18" height="18" rx="4" fill="#2c4f80"/><rect x="88" y="110" width="18" height="18" rx="4" fill="#3f86e0"/><rect x="110" y="110" width="18" height="18" rx="4" fill="#2c4f80"/><rect x="132" y="110" width="18" height="18" rx="4" fill="#3f86e0"/><rect x="154" y="110" width="18" height="18" rx="4" fill="#24406a"/>
    <rect x="0" y="132" width="18" height="18" rx="4" fill="#1b2230"/><rect x="22" y="132" width="18" height="18" rx="4" fill="#1b2230"/><rect x="44" y="132" width="18" height="18" rx="4" fill="#1b2230"/><rect x="66" y="132" width="18" height="18" rx="4" fill="#24406a"/><rect x="88" y="132" width="18" height="18" rx="4" fill="#2c4f80"/><rect x="110" y="132" width="18" height="18" rx="4" fill="#3f86e0"/><rect x="132" y="132" width="18" height="18" rx="4" fill="#b9b9c2" stroke="#ffd65a" stroke-width="2"/><rect x="154" y="132" width="18" height="18" rx="4" fill="#3f86e0" stroke="#ffd65a" stroke-width="2"/>
  </g>
  <text x="565" y="248" fill="#c9d2de" font-size="12.5" text-anchor="middle">each pixel sees only its 8 neighbours</text>
  <text x="565" y="266" fill="#8b95a5" font-size="12" text-anchor="middle">shared 3×3 rule, repeated T steps</text>
  <path d="M655 110 C 700 95, 700 150, 658 140" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <text x="705" y="118" fill="#8b95a5" font-size="12">× T</text>

  <!-- salida -->
  <path d="M660 220 H720" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <rect x="725" y="170" width="150" height="100" rx="12" fill="#172338" stroke="#2a78d6"/>
  <text x="800" y="200" fill="#9cc3f5" font-size="13" font-weight="700" text-anchor="middle">SAME DICTIONARY</text>
  <text x="800" y="222" fill="#d4e3f7" font-size="12.5" text-anchor="middle">output pixel colour</text>
  <text x="800" y="240" fill="#d4e3f7" font-size="12.5" text-anchor="middle">→ word (tied weights)</text>
  <path d="M880 220 H910" stroke="#5b6472" stroke-width="2" marker-end="url(#a)"/>
  <rect x="915" y="200" width="68" height="40" rx="10" fill="#15301f" stroke="#3fbf6a"/>
  <text x="949" y="225" fill="#8fe3a8" font-size="15" font-weight="700" text-anchor="middle">girl</text>

  <!-- escáner -->
  <path d="M565 280 V318" stroke="#8a5cd6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="330" y="322" width="470" height="52" rx="12" fill="#1f1830" stroke="#8a5cd6"/>
  <text x="565" y="344" fill="#c9b3f5" font-size="13" font-weight="700" text-anchor="middle">SCANNER · dictionary applied to every pixel, every step</text>
  <text x="565" y="363" fill="#a99bc6" font-size="12" text-anchor="middle">read what each region is "thinking" — and train it to stay legible (school loss)</text>

  <!-- lienzos que crecen -->
  <rect x="820" y="60" width="160" height="80" rx="12" fill="#161d27" stroke="#2c3544" stroke-dasharray="4 4"/>
  <text x="900" y="86" fill="#8b95a5" font-size="12" font-weight="700" text-anchor="middle">GROWING CANVASES</text>
  <text x="900" y="106" fill="#8b95a5" font-size="11.5" text-anchor="middle">unreadable input? →</text>
  <text x="900" y="124" fill="#8b95a5" font-size="11.5" text-anchor="middle">freeze + add a canvas</text>
</svg>
