name: NeuroPixel frozen-readout contracts and actual parent admission
on:
  push:
    branches: [research/frozen-readout-preflight-2026-10-08]
    paths:
      - .github/workflows/readout-preflight.yml
      - neuropixel/research/frozen_readout.py
      - scripts/test_frozen_readout_contracts.py
      - scripts/admit_READ03_parents.py
      - neuropixel/research/readout_experiment.py
      - scripts/research_READ03.py
      - scripts/test_readout_experiment_contracts.py
      - docs/research/READ03_parent_inventory.json
permissions:
  contents: write
concurrency:
  group: neuropixel-read03-preflight-20261008
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      QTRAIN_U16_ARCHIVE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Fixed original CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.1 psutil==6.1.1 pillow==11.3.0
      - name: Actual RAM and unchanged U16 governing sources
        run: |
          python - <<'PY'
          import hashlib,json,psutil
          from pathlib import Path
          assert psutil.virtual_memory().available/2**30>=8
          raw=Path('docs/research/OPT03_QTRAIN_U16_plan.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='a4093bb8d559404b9f68587b753f8cea180a1e75d33363a04c1f2c7ebcb22dc0'
          for name,digest in json.loads(raw)['source_sha256'].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest
          print(json.dumps({'frozen_sources_unchanged':True,'scientific_updates':0}))
          PY
      - name: Compact reconstruction and frozen-parameter fixture contracts
        run: python scripts/test_frozen_readout_contracts.py
      - name: Cache reference decisions, head-only fitting and interrupted-resume fixtures
        run: python scripts/test_readout_experiment_contracts.py
      - name: Admit all twelve actual closed parents without fitting
        run: python scripts/admit_READ03_parents.py --recover-cloud --expected-inventory-sha256 f2574cabde30ff6a613ddbae591646efb4dc4aba6124e99761ade7c140637414
      - name: Preserve factual preflight receipts in Git
        if: always()
        run: |
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('transport','neuropixel/research/qtrain_budget_transport.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          base='results/research/READ03_preflight_cloud/'+os.environ['GITHUB_RUN_ID']+'/'
          available=[]
          for name in ['receipt.json','local_admission_refused.json','parent_admission_receipt.json']:
              path=Path('results/research/READ03_contracts')/name
              if path.exists():m.publish_immutable(base+name,path.read_bytes());available.append(name)
          controller=Path('results/research/READ03_controller_contracts/receipt.json')
          if controller.exists():m.publish_immutable(base+'controller_receipt.json',controller.read_bytes());available.append('controller_receipt.json')
          receipt={'source_commit':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'available_receipts':available,'scientific_head_fits':0,'new_backbone_updates':0,'scientific_dataset_evaluations':0,'test_accessed':False,'scope':'Untrained synthetic fixtures plus restoration/freeze of all12actual bodies; not a scientific fitting experiment'}
          m.publish_immutable(base+'scope_receipt.json',(json.dumps(receipt,indent=2)+'\n').encode())
          print(json.dumps(receipt))
          PY
