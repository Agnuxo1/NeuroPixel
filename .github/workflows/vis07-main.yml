name: VIS07 five paired external pixel realizations
on:
  push:
    branches: [research/vis07-main-2026-10-09]
permissions:
  contents: write
concurrency:
  group: vis07-frozen-main
  cancel-in-progress: false
jobs:
  all_five_pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      QTRAIN_U16_ARCHIVE_TOKEN: ${{ github.token }}
      VIS07_PUBLISH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Fixed CPU environment
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.1 psutil==6.1.1 pillow==11.3.0
      - name: Same fixed forty epochs per all-ten family/seed before official test
        run: python scripts/research_VIS07_main.py --output results/research/VIS07_MAIN
      - name: Preserve full original or partial outcome
        if: always()
        run: |
          mkdir -p results/research/VIS07_MAIN
          python - <<'PY'
          import os,json
          from pathlib import Path
          Path('results/research/VIS07_MAIN/attempt.json').write_text(json.dumps(dict(source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],result_exists=Path('results/research/VIS07_MAIN/result.json').exists(),final_access_consumed=Path('results/research/VIS07_MAIN/final_access.json').exists()),indent=2)+'\n')
          PY
          python scripts/publish_sprint_evidence.py --root results/research/VIS07_MAIN --registration VIS07MAIN --branch research/vis07-main-evidence-2026-10-09
