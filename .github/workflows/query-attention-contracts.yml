name: NeuroPixel untrained attention contracts
on:
  push:
    branches: [research/query-attention-contracts-2026-10-08]
    paths:
      - .github/workflows/query-attention-contracts.yml
      - neuropixel/research/query_attention.py
      - scripts/test_query_attention_contracts.py
permissions:
  contents: write
concurrency:
  group: neuropixel-query-attention-contracts-20261008
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      QTRAIN_U16_ARCHIVE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Fixed CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.1 psutil==6.1.1 pillow==11.3.0
      - name: RAM admission and unchanged nineteen frozen sources
        run: |
          python - <<'PY'
          import hashlib,json,psutil
          from pathlib import Path
          ram=psutil.virtual_memory().available/2**30
          assert ram>=8
          raw=Path('docs/research/OPT03_QTRAIN_U16_plan.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='a4093bb8d559404b9f68587b753f8cea180a1e75d33363a04c1f2c7ebcb22dc0'
          for name,digest in json.loads(raw)['source_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest
          print(json.dumps({'available_ram_gib':ram,'scientific_updates':0,'frozen_sources_unchanged':True}))
          PY
      - name: Analytic attention and preservation contracts only
        run: python scripts/test_query_attention_contracts.py
      - name: Preserve factual contract receipt in Git
        if: always()
        run: |
          python - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          s=importlib.util.spec_from_file_location('transport','neuropixel/research/qtrain_budget_transport.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          base='results/research/query_attention_preflight_cloud/'+os.environ['GITHUB_RUN_ID']+'/'
          files=['receipt.json','local_admission_refused.json']
          available=[]
          for name in files:
              path=Path('results/research/query_attention_preflight')/name
              if path.exists():m.publish_immutable(base+name,path.read_bytes());available.append(name)
          receipt={'source_commit':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],'available_receipts':available,'scientific_updates':0,'scientific_dataset_evaluations':0,'test_accessed':False,'scope':'Untrained analytic fixtures and original-core preservation, not a training experiment or evidence of competence'}
          m.publish_immutable(base+'scope_receipt.json',(json.dumps(receipt,indent=2)+'\n').encode())
          print(json.dumps(receipt))
          PY
