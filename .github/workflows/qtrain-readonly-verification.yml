name: QTRAIN read-only endpoint verification
on:
  push:
    branches: [research/query-supervision-replay-2026-10-08]
    paths:
      - .github/workflows/qtrain-readonly-verification.yml
      - scripts/replay_OPT03_QTRAIN.py
      - scripts/verify_QTRAIN_archived_cases.py
permissions:
  contents: write
jobs:
  readonly-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      VERIFICATION_ARCHIVE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixed read-only CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.1 psutil==6.1.1 pillow==11.3.0
      - name: RAM admission
        run: python -c "import psutil; assert psutil.virtual_memory().available/2**30>=8"
      - name: Replay only published exact scientific cases
        run: python scripts/verify_QTRAIN_archived_cases.py
