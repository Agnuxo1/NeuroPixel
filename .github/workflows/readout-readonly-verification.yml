name: NeuroPixel READ03 read-only endpoint verification
on:
  push:
    branches: [research/frozen-readout-replay-2026-10-08]
    paths:
      - .github/workflows/readout-readonly-verification.yml
      - scripts/replay_READ03.py
      - scripts/verify_READ03_archived_fits.py
      - scripts/test_READ03_recount.py
permissions:
  contents: write
concurrency:
  group: neuropixel-read03-readonly-20261008
  cancel-in-progress: false
jobs:
  readonly-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      QTRAIN_U16_ARCHIVE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Original fixed CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.1 psutil==6.1.1 pillow==11.3.0
      - name: Frozen experiment hashes and independent recount contracts
        run: |
          python - <<'PY'
          import psutil
          from pathlib import Path
          from scripts.research_READ03 import load_plan
          assert psutil.virtual_memory().available/2**30>=8
          load_plan(Path('docs/research/READ03_execution_plan.json'),'d273b8284d9a387b49266dc4ec62cfad76aefaa11c5f82c7ab6a97ba0e431ea0')
          print('Admission passed; zero optimizer updates and no final test')
          PY
          python scripts/test_READ03_recount.py -v
      - name: Independently recount and replay every available fixed head endpoint
        run: python scripts/verify_READ03_archived_fits.py
