name: Item 13 vocabulary and distractor evidence
on:
  push:
    branches: [research/scientific-validation-2026-10-07-cloud]
    paths: [docs/research/13_probe_plan.json]
permissions:
  contents: write
concurrency:
  group: neuropixel-item13
  cancel-in-progress: false
jobs:
  vocabulary-evidence:
    if: github.repository == 'Agnuxo1/NeuroPixel' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      CUDA_VISIBLE_DEVICES: ""
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Reserve a finite workflow deadline
        id: deadline
        timeout-minutes: 1
        shell: bash
        run: |
          python -c 'import os,time; f=open(os.environ["GITHUB_ENV"],"a"); f.write("ITEM13_JOB_DEADLINE_UNIX="+str(time.time()+1170)+"\n"); f.close()'
      - name: Check out the isolated item-13 source
        id: checkout
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up the declared Python version
        id: setup
        timeout-minutes: 4
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install the pinned CPU diagnostic dependencies
        id: install
        timeout-minutes: 10
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: numpy==2.2.6 scipy==1.15.1 Pillow==12.3.0 psutil==7.2.2 pytest==9.1.1
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu
      - name: Validate contracts, execute the frozen vocabulary evidence and archive
        id: worker
        shell: bash
        run: python scripts/research_item13_worker.py --phase probe
      - name: Preserve a bootstrap outcome record in Actions
        if: always()
        timeout-minutes: 1
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        shell: bash
        run: |
          /usr/bin/python3 -c 'import json,os,datetime; print(json.dumps({"event":"item13_probe_bootstrap_outcome","at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"outcomes":{k:os.environ[k] for k in ("CHECKOUT_OUTCOME","SETUP_OUTCOME","INSTALL_OUTCOME","WORKER_OUTCOME")},"scope":"Pre-worker failures are preserved by complete Actions logs and provider status; no dataset or scientific execution is claimed when the worker did not start."}))'
