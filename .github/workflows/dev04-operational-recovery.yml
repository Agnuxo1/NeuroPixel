name: NeuroPixel DEV04 failed-start operational recovery
on:
  push:
    branches: [research/dev04-operational-recovery-2026-10-08]
    paths:
      - .github/workflows/dev04-operational-recovery.yml
permissions:
  contents: write
concurrency:
  group: neuropixel-dev04-operational-recovery-20261008
  cancel-in-progress: false
jobs:
  recover:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case:
          - DEV04_partition101_seed400
          - DEV04_partition101_seed402
          - DEV04_partition101_seed403
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      QTRAIN_U16_ARCHIVE_TOKEN: ${{ github.token }}
      DEV04_PUBLISH: "1"
      DEV04_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - name: Require initial execution terminal before allocating scientific work
        run: |
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('transport','neuropixel/research/qtrain_budget_transport.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          r=json.loads(m.fetch('https://api.github.com/repos/Agnuxo1/NeuroPixel/actions/runs/37845945011'))
          assert r['head_sha']=='b9431e9b927ba5b6539a172d4b27fe6199776462'
          assert r['status']=='completed','Do not overlap scientific runners with initial execution'
          print('Initial execution terminal; only verified zero-update startup failures eligible')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Identical frozen scientific CPU software
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.1 psutil==6.1.1 pillow==11.3.0
      - name: Verify unchanged forty-three governing files and RAM
        run: |
          python - <<'PY'
          import psutil
          from pathlib import Path
          from scripts.research_DEV04 import load_plan
          assert psutil.virtual_memory().available/2**30>=8
          p=load_plan(Path('docs/research/DEV04_execution_plan.json'),'2484f3c5917e474ca3755bcdbbaca7d322077615ba47d51653116042d980f20a')
          assert len(p['source_sha256'])==43
          print('Original scientific recipe/43source hashes unchanged; recovery is an execution wrapper')
          PY
      - name: Recover durable stages and run only the registered failed case
        run: python scripts/research_DEV04.py --case "$DEV04_CASE" --recover-cloud --expected-plan-sha256 2484f3c5917e474ca3755bcdbbaca7d322077615ba47d51653116042d980f20a
      - name: Preserve recovery attempt under its new workflow identifier
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from neuropixel.research import dev04_transport as archive
          case=os.environ['DEV04_CASE'];branch=archive.select_case_archive_branch(case)
          root=Path('results/research/DEV04');folder=root/case
          available=any((folder/stage/'progress.json').exists() for stage in ('body','query_attention','local_query'))
          if available:archive.publish_case(root,case,Path('docs/research/DEV04_execution_plan.json'))
          receipt={'execution_source_commit':os.environ['GITHUB_SHA'],'frozen_recipe_source_commit':'b9431e9b927ba5b6539a172d4b27fe6199776462','workflow_run_id':os.environ['GITHUB_RUN_ID'],'initial_workflow_run_id':37845945011,'case_run_id':case,'archive_branch':branch,'durable_evidence_available':available,'completed':(folder/'result.json').exists(),'plan_sha256':'2484f3c5917e474ca3755bcdbbaca7d322077615ba47d51653116042d980f20a','scientific_governing_files_changed':False,'historical_checkpoint_loaded':False,'test_scored':False,'scientific_task3_complete':False}
          archive.old.publish_immutable('results/research/DEV04_cloud/'+archive.REG+'/attempts/'+os.environ['GITHUB_RUN_ID']+'/'+case+'/attempt_receipt.json',(json.dumps(receipt,indent=2)+'\n').encode())
          print(json.dumps(receipt))
          PY

