name: NeuroPixel item 6 frozen study

on:
  push:
    branches:
      - research/scientific-validation-2026-10-07-cloud
    paths:
      - '.github/workflows/research-item6.yml'
      - 'docs/research/06_execution_plan.json'

permissions:
  contents: write

concurrency:
  group: neuropixel-item6-cloud
  cancel-in-progress: false

jobs:
  frozen-study:
    if: github.repository == 'Agnuxo1/NeuroPixel' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CUBLAS_WORKSPACE_CONFIG: ':4096:8'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the isolated frozen research commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Set up the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.8'
      - name: Install the declared CPU-only Torch release
        run: python -m pip install --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install the remaining fixed research dependencies
        run: python -m pip install --no-cache-dir -r requirements/research-cloud.txt
      - name: Validate, execute and preserve only the frozen item-6 study
        run: python scripts/research_item6_worker.py
