name: VIS07 fixed-tolerance depth compatibility diagnostic
on:
  push:
    branches: [research/vis07-depth-diagnostic-2026-10-09]
permissions:
  contents: write
concurrency:
  group: vis07-depth-diagnostic
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      QTRAIN_U16_ARCHIVE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Identical CPU software
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 scipy==1.15.1 psutil==6.1.1 pillow==11.3.0
      - name: Read-only exact original archived predictions
        run: python scripts/diagnose_VIS07_depth.py --output results/research/VIS07_DEPTH
      - name: Preserve original proof or failure
        if: always()
        run: |
          mkdir -p results/research/VIS07_DEPTH
          python scripts/publish_sprint_evidence.py --root results/research/VIS07_DEPTH --registration VIS07DEPTH --branch research/vis07-depth-diagnostic-evidence-2026-10-09
