name: Item 9 offline audit host fallback
on:
  push:
    branches: [research/scientific-validation-2026-10-07-cloud]
    paths: [docs/research/09_offline_plan.json]
permissions:
  contents: write
concurrency:
  group: neuropixel-item9-offline-audit
  cancel-in-progress: false
jobs:
  offline-audit:
    if: github.repository == 'Agnuxo1/NeuroPixel' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      GIT_TERMINAL_PROMPT: "0"
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/neuropixel-item9-matplotlib
    steps:
      - name: Reserve a finite workflow deadline
        id: deadline
        timeout-minutes: 1
        shell: bash
        run: |
          python -c 'import os,time; f=open(os.environ["GITHUB_ENV"],"a"); f.write("ITEM9_OFFLINE_DEADLINE_UNIX="+str(time.time()+1770)+"\n"); f.close()'
      - name: Check out the isolated audit source
        id: checkout
        timeout-minutes: 3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up the frozen offline Python version
        id: setup
        timeout-minutes: 4
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install the recorded offline dependencies
        id: install
        timeout-minutes: 4
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 psutil==7.2.2
      - name: Execute unchanged audits and retain their first receipts
        id: offline
        shell: bash
        run: python scripts/research_item9_offline_worker.py
      - name: Preserve a bootstrap outcome record in Actions
        if: always()
        timeout-minutes: 1
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          OFFLINE_OUTCOME: ${{ steps.offline.outcome }}
        shell: bash
        run: |
          /usr/bin/python3 -c 'import json,os,datetime; print(json.dumps({"event":"item9_offline_bootstrap_outcome","at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"run_id":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"],"outcomes":{k:os.environ[k] for k in ("CHECKOUT_OUTCOME","SETUP_OUTCOME","INSTALL_OUTCOME","OFFLINE_OUTCOME")},"scope":"Pre-worker failures are preserved by complete Actions logs and provider status; no scientific audit is claimed when the worker did not start."}))'
