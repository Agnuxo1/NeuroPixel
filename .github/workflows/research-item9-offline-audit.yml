name: Item 9 offline audit host fallback
on:
  push:
    branches: [research/scientific-validation-2026-10-07-cloud]
    paths: [docs/research/09_offline_plan.json]
permissions:
  contents: write
concurrency:
  group: neuropixel-item9-offline-audit
  cancel-in-progress: false
jobs:
  offline-audit:
    if: github.repository == 'Agnuxo1/NeuroPixel'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      GIT_TERMINAL_PROMPT: "0"
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/neuropixel-item9-matplotlib
    steps:
      - name: Reserve a finite workflow deadline
        shell: bash
        run: |
          python -c 'import os,time; f=open(os.environ["GITHUB_ENV"],"a"); f.write("ITEM9_OFFLINE_DEADLINE_UNIX="+str(time.time()+1770)+"\n"); f.close()'
      - name: Check out the isolated audit source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up the frozen offline Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
          check-latest: false
      - name: Install the recorded offline dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 psutil==7.2.2
      - name: Execute unchanged audits and retain their first receipts
        shell: bash
        run: python scripts/research_item9_offline_worker.py
